<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kylian Gagnon · wireredblue</title>
    <meta
      name="description"
      content="Portfolio de Kylian Gagnon, développeur fullstack en alternance à Lyon. Un zoom infini de l'espace jusqu'au serveur."
    />
    <meta name="theme-color" content="#05060d" />
    <meta property="og:title" content="Kylian Gagnon · wireredblue" />
    <meta property="og:description" content="Un portfolio en zoom infini : de l'espace jusqu'au serveur." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="scene-over" aria-hidden="true"></canvas>

    <header class="brand">
      <a href="#espace" data-level="0" class="brand-name">kylian gagnon</a>
      <span class="brand-sub"><i class="dot red"></i><i class="dot blue"></i>wireredblue.xyz</span>
    </header>

    <div class="top-actions">
      <button id="text-btn" class="pill" type="button">Version texte</button>
      <a id="gh-link" class="pill icon" href="#" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
          />
        </svg>
      </a>
    </div>

    <nav class="levels" aria-label="Niveaux">
      <ol id="level-list"></ol>
    </nav>

    <section class="caption" id="caption" aria-live="polite">
      <button class="cap-toggle" id="cap-toggle" type="button" aria-expanded="true" aria-label="Réduire la légende">–</button>
      <p class="kicker" id="cap-kicker"></p>
      <h1 id="cap-title"></h1>
      <p class="body" id="cap-body"></p>
    </section>

    <div class="hint" id="hint">
      <span class="mouse" aria-hidden="true"><i></i></span>
      <span class="hint-desk">Fais défiler pour plonger · clique sur ce qui pulse</span>
      <span class="hint-touch">Glisse vers le haut pour plonger · touche ce qui pulse</span>
    </div>

    <div class="tooltip" id="tooltip" role="tooltip"></div>

    <dialog id="panel" class="panel" aria-labelledby="panel-title">
      <button class="close" type="button" data-close aria-label="Fermer">×</button>
      <p class="kicker" id="panel-kicker"></p>
      <h2 id="panel-title"></h2>
      <ul class="tags" id="panel-tags"></ul>
      <div id="panel-body"></div>
      <div class="links" id="panel-links"></div>
    </dialog>

    <dialog id="text-version" class="panel wide" aria-labelledby="tv-title">
      <button class="close" type="button" data-close aria-label="Fermer">×</button>
      <h2 id="tv-title">Version texte</h2>
      <p class="muted">Tout le contenu du site, sans le zoom. Clique sur un titre pour y aller en zoomant.</p>
      <div id="tv-content"></div>
    </dialog>

    <noscript>
      <div class="noscript">
        <h1>Kylian Gagnon</h1>
        <p>Développeur fullstack en alternance à Lyon. Ce portfolio a besoin de JavaScript pour son zoom infini.</p>
        <p><a href="https://github.com/XxWirexX">github.com/XxWirexX</a></p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
