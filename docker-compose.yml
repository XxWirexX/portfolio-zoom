# Le site est construit depuis le Dockerfile (Vite → nginx, port 3000).
# Push sur main : la CD reconstruit et relance le conteneur.
services:
  app:
    build: .
    container_name: portfolio-zoom
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks:
      - proxy

networks:
  proxy:
    external: true
