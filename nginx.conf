server {
  listen 3000;
  listen [::]:3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Fichiers avec empreinte (Vite) : cache long
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # La page elle-même : toujours revalidée, pour voir les nouvelles versions
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
